name: RM Camera Relay
version: "0.2.0"
slug: rm_camera_relay
description: RM-authorized relay for two cameras only
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: false
auth_api: false
# Tailscale also uses the host network. Never publish the cleartext listener on LAN.
host_network: true
map:
  - ssl:ro
# Supervisor's [HOST] watchdog targets a host-network address, not loopback.
# Omit the application watchdog; retain the local /healthz endpoint.
options:
  rm_grant_public_jwk: ""
  relay_private_jwk_file: /ssl/rm-camera-relay-private.jwk
schema:
  rm_grant_public_jwk: str
  relay_private_jwk_file: str